<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luiz Domingues</title>
  <meta name="description" content="Landing page pessoal de Luiz Domingues." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <svg class="noise-defs" aria-hidden="true" width="0" height="0">
    <filter id="noiseFilter">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.85"
        numOctaves="2"
        stitchTiles="stitch"
      />
      <feColorMatrix
        type="saturate"
        values="0"
      />
    </filter>
  </svg>

  <div class="page-shell">
    <div class="page-shell__grain" aria-hidden="true"></div>

    <header class="topbar">
      <button
        class="lang-toggle"
        type="button"
        aria-label="Toggle language"
        data-lang-toggle
        data-lang="en"
      >
        <span class="lang-toggle__track">
          <span class="lang-toggle__thumb"></span>
          <span class="lang-toggle__option" data-lang-option="pt">br</span>
          <span class="lang-toggle__option is-active" data-lang-option="en">en</span>
        </span>
      </button>
    </header>

    <main class="hero">
      <div class="hero__content" data-i18n="content"></div>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
